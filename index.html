<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Кулак Комбат: Искра против Батьки Усача</title>
<style>
:root{--bg:#0f1a24;--ink:#eef6ff;--a:#ff8a1f;--b:#2fa4ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Trebuchet MS",Verdana,sans-serif;display:flex;flex-direction:column;user-select:none;touch-action:none}
#wrap{position:relative;flex:1;min-height:0}
canvas{width:100%;height:100%;display:block}
#ctl{display:flex;justify-content:space-between;padding:8px 6px 12px}
#ctl div{display:flex;gap:6px}
#ctl button{width:44px;height:54px;border-radius:14px;border:2px solid rgba(255,255,255,.25);font-size:12px;padding:0;font-family:inherit;color:#fff;background:#24445f}
#ctl button.a{background:#d6561a}
#ctl button:active{filter:brightness(1.4)}
#menu{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:rgba(15,26,36,.93);text-align:center;padding:16px;overflow:auto}
#menu h1{margin:0;font-size:28px;color:var(--a)}
#menu p{margin:0;max-width:320px;line-height:1.4;font-size:15px}
.card,#go{background:#1d3a52;color:#fff;border:2px solid var(--b);border-radius:14px;padding:10px 16px;font-size:16px;font-family:inherit;width:280px;text-align:left}
.card b{color:var(--a);font-size:18px}
#menu.sel{background:transparent;justify-content:space-between;padding:8px;pointer-events:none}#menu.sel p{display:none}#menu.sel h1{font-size:22px;margin:4px 0 0}
.row{display:flex;gap:6px;width:100%;pointer-events:auto}.row .card{flex:1;width:auto;padding:8px 4px;font-size:12px;text-align:center;line-height:1.35;background:rgba(29,58,82,.92)}.row .card b{font-size:16px}.row .card small{color:#ffd23f;font-size:12px}
.col{display:flex;flex-direction:column;gap:8px;width:100%;pointer-events:auto}
.shopb{background:linear-gradient(#ff5a3c,#b3101a);color:#fff;border:2px solid #ffd27a;border-radius:12px;padding:10px;font-size:16px;font-family:inherit;font-weight:bold;box-shadow:0 0 14px rgba(255,90,40,.5)}
.row .card{background:linear-gradient(#2c4f6e,#14283a);border:2px solid #ffb21a;box-shadow:0 0 12px rgba(255,150,0,.3)}
#menu.shop{justify-content:flex-start;padding-top:14px;background:rgba(12,20,30,.97)}
#menu h2{margin:6px 0 0;font-size:18px;color:#ffc857}
.item{display:flex;align-items:center;gap:8px;width:310px;max-width:96%;background:#1d3a52;border:2px solid #2fa4ff;border-radius:12px;padding:8px 10px;text-align:left;box-sizing:border-box}
.item div{flex:1}.item b{color:#ffb21a;display:block}.item small{opacity:.85;font-size:12px}
.item button{background:#d6561a;color:#fff;border:0;border-radius:10px;padding:8px 10px;font-family:inherit;font-size:14px;min-width:92px}
.item button.off{background:#4a5560;opacity:.7}
#go{background:#d6561a;border-color:#ff8a1f;text-align:center;font-size:20px;width:auto;padding:12px 30px}
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas><div id="menu"></div><button id="mu" style="position:absolute;right:6px;top:64px;width:36px;height:36px;border-radius:50%;border:0;background:rgba(0,0,0,.45);color:#fff;font-size:18px;z-index:5;padding:0">🔊</button></div>
<div id="ctl">
<div><button id="bl">◀</button><button id="br">▶</button><button id="bj">▲</button></div>
<div><button id="bb">Блок</button><button class="a" id="bh">Удар</button><button class="a" id="bk">Нога</button><button class="a" id="bs">Спец</button></div>
</div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),menu=document.getElementById('menu');
const HERO=[
 {n:'Искра',look:'iskra',spt:'bolt',boltc:'#ffd23f',spn:'Шаровая молния',c:'#2fa4ff',hair:'#ffd23f',spd:215,dmg:1,hp:100,d:'Быстрая, ловкая'},
 {n:'Тихий',look:'tihiy',spt:'club',spn:'Удар дубиной',c:'#2e9e6b',hair:'#2b2b2b',spd:150,dmg:1.45,hp:125,d:'Медленный, очень сильный'},
 {n:'Барбарис',look:'barb',spt:'slash',spn:'Клинок-рывок',c:'#b3262e',hair:'#d8dde2',spd:185,dmg:1.15,hp:100,d:'Сбалансированный, копит силу быстрее',en:1.6}];
const FOES=[
 {n:'Омоновец',look:'omon',spt:'club',c:'#3b4a5a',hair:'#222',lvl:1,hp:90,helm:1},
 {n:'Умка',look:'umka',spt:'bolt',boltc:'#ffffff',c:'#e8eef2',hair:'#f4f7fa',lvl:2,hp:110},
 {n:'Батька Усач',look:'batka',spt:'club',c:'#6b5a2e',hair:'#3a2a1a',lvl:3,hp:140,boss:1}];
let W,H,G,P,E,run=false,last=0,wins,stage,hero,sel,msg='',msgT=0,over=false,tm=0,parts=[],shake=0,combo=0,comboT=0,k={l:0,r:0,b:0};
function resize(){const d=devicePixelRatio||1,r=cv.getBoundingClientRect();W=r.width;H=r.height;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0);G=H-34}
addEventListener('resize',resize);
function mk(x,dir,s,p){return{x,y:0,vy:0,dir,s,p,hp:s.hp*(p?1.4:2),max:s.hp*(p?1.4:2),en:0,atk:0,hit:false,sp:false,blk:false,stun:0,ai:1,walk:0}}
function newRound(){P=mk(W*.25,1,{...hero,hp:hero.hp},1);E=mk(W*.75,-1,FOES[stage],0);over=false;tm=99;combo=0;parts=[];bl=[];splats=[];shots=[];camT=2.5;cam.t=0}
function menuHTML(h,p,body){menu.className='';menu.innerHTML='<h1>'+h+'</h1><p>'+p+'</p>'+body;menu.style.display='flex'}
function pick(){selStart();return;run=false;menuHTML('Кулак Комбат','Искра против Батьки Усача. Победи трёх соперников подряд и дойди до финала. Выбери бойца:',HERO.map((h,i)=>'<button class="card" onclick="begin('+i+')"><b>'+h.n+'</b><br>'+h.d+'</button>').join(''))}
function begin(i){ac();selMode=false;hero=HERO[i];stage=0;wins=0;startFight()}
function startFight(){resize();newRound();menu.style.display='none';run=true;last=performance.now();msg=FOES[stage].n+'!';msgT=1.4;SFX.start();requestAnimationFrame(loop)}
function hold(id,key){const e=document.getElementById(id);e.onpointerdown=()=>k[key]=1;e.onpointerup=e.onpointerleave=e.onpointercancel=()=>k[key]=0}
hold('bl','l');hold('br','r');hold('bb','b');
function jump(f){if(f.y<=0&&f.stun<=0){f.vy=450;SFX.jump()}}
function attack(f,sp){if(!run||over||f.atk>0||f.stun>0)return;f.kick=sp===2||sp===4;f.spin=sp>=3;if(sp===1){if(f.en<100)return;f.en=0;f.sp=true}else f.sp=false;if(sp===0)f.v=((f.v||0)+1)%3;if(sp===2)f.v=((f.v||0)+1)%2;f.atk=sp===1?.55:sp>=3?.5:sp===2?[.34,.5][f.v]:[.26,.36,.4][f.v];if(!f.p)f.atk*=.8;if(sp===1&&f.s.look=='umka')f.kb=-f.dir*650;f.tot=f.atk;f.hit=false;SFX.whoosh()}
let lastK=0;function kick(){const n=performance.now();if(n-lastK<350&&!(P.atk>0&&P.spin)){P.atk=0;attack(P,4);lastK=0}else{attack(P,2);lastK=n}}
let lastP=0;function punch(){const n=performance.now();if(n-lastP<350&&!(P.atk>0&&P.spin)){P.atk=0;attack(P,3);lastP=0}else{attack(P,0);lastP=n}}
document.getElementById('bh').onpointerdown=punch;
document.getElementById('bs').onpointerdown=()=>attack(P,1);
document.getElementById('bj').onpointerdown=()=>jump(P);
document.getElementById('bk').onpointerdown=kick;
addEventListener('keydown',e=>{if(e.key=='ArrowLeft')k.l=1;if(e.key=='ArrowRight')k.r=1;if(e.key=='ArrowUp')jump(P);if(e.key=='x')k.b=1;if(e.key=='z')punch();if(e.key=='v')kick();if(e.key=='c')attack(P,1)});
addEventListener('keyup',e=>{if(e.key=='ArrowLeft')k.l=0;if(e.key=='ArrowRight')k.r=0;if(e.key=='x')k.b=0});
function spark(x,y,col,n){for(let i=0;i<n;i++)parts.push({x,y,vx:(Math.random()-.5)*400,vy:Math.random()*300+80,l:.4,c:col})}
function strike(a,d){
 if(a.atk<=0||a.hit)return;const tot=a.tot;if(!tot){a.atk=0;return}if(a.atk>tot*.55)return;a.hit=true;if(a.sp&&a.s.spt=='bolt'){SFX.shot();shots.push({x:a.x+a.dir*30*FS,y:a.y,dir:a.dir,o:a,c:a.s.boltc||'#ffd23f'});return}
 if(Math.abs(a.x-d.x)>FS*.85*(a.p?(item('w').reach||1):1)*(a.sp?(a.s.spt=='club'?140:125):a.spin?(a.kick?125:110):a.kick?([100,112][a.v]||100):([88,80,76][a.v]||88))||Math.abs(a.y-d.y)>45)return;
 if(!a.spin&&a.dir!=(d.x>a.x?1:-1))return;
 let dmg=a.sp?(a.s.spt=='club'?20:a.s.spt=='slash'?17:14):a.spin?(a.kick?15:12):a.kick?([7,10][a.v]||7):([6,8,10][a.v]||6);
 if(a.p){dmg*=a.s.dmg*(1+Math.min(combo,6)*.12)*(item('w').dmg||1)}else dmg*=(.65+a.s.lvl*.2)*(item('a').def||1)*.8;
 const hy=(d.y+80)*FS;
 if(d.blk&&d.stun<=0&&d.atk<=0){d.hp-=dmg*((d.p&&item('a').perfect)?0:.12);d.x+=a.dir*12;spark(d.x-a.dir*20,hy,'#cfe8ff',5);SFX.block();if(!a.p)shake=3}
 else{d.hp-=dmg;d.stun=a.sp?.55:a.spin?.7:.28;d.x+=a.dir*(a.sp?(a.s.spt=='club'?110:70):a.spin?0:28);if(a.spin)d.kb=a.dir*700;d.atk=0;d.vy=a.sp?320:a.spin?430:(!a.kick&&a.v==2?380:0);blood(d.x,hy,a.sp?28:(a.spin||a.kick?14:10));(a.sp?SFX.big():SFX.hit());spark(d.x,hy,a.sp?'#ffd23f':'#ff8a1f',a.sp?14:6);shake=a.sp?10:4;
  if(a.p){coins++;combo++;comboT=1.1;a.en=Math.min(100,a.en+(a.sp?0:11*(a.s.en||1)))}else{combo=0;a.en=Math.min(100,a.en+8)}}
 d.en=Math.min(100,d.en+3);
}
function ai(f,t,dt){
 const d=Math.abs(f.x-t.x),L=f.s.lvl,R=72*FS;
 f.cd=(f.cd||0)-dt;f.blkT=(f.blkT||0)-dt;
 const rise=t.atk>0&&!f.pa,drop=t.atk<=0&&f.pa;f.pa=t.atk>0;
 if(f.stun>0||f.atk>0){f.blk=false;return}
 if(rise&&d<160*FS&&Math.random()<[.4,.52,.64][L-1]){const r=Math.random();if(r<.5){f.blk=true;f.blkT=.5}else if(r<.78){jump(f)}else{f.kb=-f.dir*520}}
 if(drop&&d<=R*1.3&&Math.random()<[.36,.48,.64][L-1]){f.blkT=0;f.blk=false;f.cd=.02}
 if(f.blkT<=0)f.blk=false;
 const sp=160+L*48;
 if(!f.blk||d>R){if(d>R*.9)f.x+=f.dir*sp*dt;else if(d<38*FS)f.x-=f.dir*90*dt}
 if(d<=R&&f.cd<=0&&f.y<=0&&!f.blk){const r=Math.random();if(f.en>=100&&r<.7)attack(f,1);else attack(f,r<.3?3:r<.5?4:r<.7?2:0);f.cd=Math.max(.2,.62-L*.12)+Math.random()*.25}
 else if(f.s.spt=='bolt'&&f.en>=100&&d>110*FS&&f.cd<=0){attack(f,1);f.cd=.8}
 if(f.y<=0&&d>R*1.5&&Math.random()<.004*L)jump(f)
}
function aiOld(f,t,dt){
 const d=Math.abs(f.x-t.x),L=f.s.lvl;
 f.ai-=dt;
 if(f.stun>0||f.atk>0)return;
 f.blk=false;
 if(d>68*FS)f.x+=f.dir*(140+L*45)*dt;else if(d<38*FS)f.x-=f.dir*70*dt;
 if(t.atk>0&&d<130*FS&&Math.random()<.008*L){f.blk=true}
 if(f.ai<=0){f.ai=Math.max(.25,.8-L*.15)+Math.random()*.3;const r=Math.random();
  if(d<=72*FS){if(f.en>=100&&r<.7)attack(f,1);else if(r<.6)attack(f,[0,0,2,3,4][Math.floor(Math.random()*5)]);else if(r<.75)f.blk=true;else if(L>1&&r<.85)jump(f)}
  else if(f.s.spt=='bolt'&&f.en>=100&&r<.5)attack(f,1);else if(L>1&&r<.15)jump(f)}
}
function loop(t){
 if(!run)return;const dt=Math.max(0,Math.min(.05,(t-last)/1000));last=t;
 if(!over){
  P.dir=E.x>P.x?1:-1;E.dir=P.x>E.x?1:-1;
  P.blk=!!k.b&&P.atk<=0&&P.stun<=0;
  if(P.stun<=0&&P.atk<=0){const v=(k.r-k.l);P.x+=v*P.s.spd*dt*(P.blk?.5:1);P.walk+=Math.abs(v)*dt*10;if(P.blk&&v*P.dir>0&&Math.abs(E.x-P.x)<75*FS&&E.stun<=0&&shoveT<=0){shoveT=.6;E.kb=P.dir*480;E.stun=.35;E.atk=0;E.vy=120;SFX.hit();spark(E.x-P.dir*30,(E.y+90)*FS,'#cfe8ff',10);shake=4}}
  ai(E,P,dt);
  for(const f of[P,E]){if(f.sp&&f.atk>0&&f.s.spt=='slash'&&f.atk>f.tot*.35)f.x+=f.dir*430*dt;f.atk=Math.max(0,f.atk-dt);f.stun=Math.max(0,f.stun-dt);if(f.kb){f.x+=f.kb*dt;f.kb*=Math.pow(.02,dt);if(Math.abs(f.kb)<5)f.kb=0}f.x=Math.max(30*FS,Math.min(W-30*FS,f.x));
   if(f.y>0||f.vy>0){f.vy-=1500*dt;f.y+=f.vy*dt;if(f.y<=0){f.y=0;f.vy=0}}}
  strike(P,E);strike(E,P);
  comboT-=dt;shoveT-=dt;if(comboT<=0)combo=0;
  tm-=dt;camT-=dt;if(cam.t>0)cam.t-=dt;if(stage<2&&camT<=0&&cam.t<=0){camT=5+Math.random()*3;cam.t=3;cam.txt=CAMEO[Math.floor(Math.random()*CAMEO.length)];speak(cam.txt)}
  if(P.hp<=0||E.hp<=0||tm<=0){over=true;const pw=E.hp<=0||(P.hp>0&&P.hp/P.max>E.hp/E.max);
   msg=tm<=0&&P.hp>0&&E.hp>0?'Время! ':'';msg+=pw?'Победа!':'Поражение';msgT=2.2;{SFX.ko();if(pw){coins+=40+stage*25;save();setTimeout(SFX.win,600)}const lo=pw?E:P;lo.hp=0;lo.atk=0;lo.stun=0;lo.blk=false;blood(lo.x,60,45)}
   setTimeout(()=>pw?next():lose(),2200)}
 }
 for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy-=900*dt;p.l-=dt}parts=parts.filter(p=>p.l>0);
 for(const p of bl){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy-=1100*dt;p.l-=dt;if(p.y<0){p.l=0;splats.push({x:p.x,w:3+Math.random()*8,o:Math.random()*14});if(splats.length>160)splats.shift()}}bl=bl.filter(p=>p.l>0);
 for(const s of shots){s.x+=s.dir*540*dt;const d=s.o===P?E:P;if(Math.abs(s.x-d.x)<26*FS&&d.y<90){s.dead=1;land(s.o,d,(s.o.p?12*s.o.s.dmg:12*(.8+s.o.s.lvl*.25)))}else if(s.x<-30||s.x>W+30)s.dead=1}shots=shots.filter(s=>!s.dead);
 msgT-=dt;shake=Math.max(0,shake-dt*30);draw();if(run)requestAnimationFrame(loop)}
function next(){stage++;if(stage>=FOES.length){coins+=150;save();run=false;menuHTML('Бульбария свободна!','Ты победил всех, включая Батьку Усача. Сыграем ещё раз другим бойцом?','<button id="go" onclick="pick()">Новая игра</button>')}else{menuHTML('Следующий бой','Дальше: '+FOES[stage].n+'. Он сильнее и быстрее.','<button id="go" onclick="startFight()">Вперёд</button>');run=false}}
function lose(){save();run=false;menuHTML('Поражение','Тебя остановил '+FOES[stage].n+'. Попробуешь снова?','<button id="go" onclick="startFight()">Реванш</button><button class="card" onclick="pick()" style="text-align:center">Сменить бойца</button>')}
function limb(x1,y1,x2,y2,w,c){ctx.lineCap='round';if(w>=7){ctx.strokeStyle='rgba(8,8,16,.55)';ctx.lineWidth=w+3;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke()}ctx.strokeStyle=c;ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke()}
let bl=[],splats=[],shots=[],selMode=false,selF=[],selT=0;
function blood(x,h,n){for(let i=0;i<n;i++)bl.push({x,y:h,vx:(Math.random()-.5)*380,vy:Math.random()*380+60,l:1.5,r:1.5+Math.random()*3})}
function land(a,d,dmg){const h=(d.y+80)*FS;if(d.blk&&d.stun<=0&&d.atk<=0){d.hp-=dmg*.12;d.x+=a.dir*12;spark(d.x-a.dir*20,h,'#cfe8ff',5);return}d.hp-=dmg*(a.p?(item('w').dmg||1):(item('a').def||1)*.8);d.stun=.4;d.x+=a.dir*40;d.atk=0;SFX.big();blood(d.x,h,18);spark(d.x,h,'#ffd23f',10);shake=7;if(a.p){combo++;comboT=1.1}else combo=0;d.en=Math.min(100,d.en+3)}
function drawSplats(){ctx.fillStyle='rgba(125,12,22,.85)';for(const s of splats){ctx.beginPath();ctx.ellipse(s.x,G+3+s.o,s.w,2.4,0,0,7);ctx.fill()}}
function drawShots(){for(const s of shots){const y=G-(s.y+78)*FS;ctx.globalAlpha=.35;ctx.strokeStyle=s.c;ctx.lineWidth=10;ctx.beginPath();ctx.moveTo(s.x-s.dir*50,y);ctx.lineTo(s.x,y);ctx.stroke();ctx.globalAlpha=1;ell(s.x,y,13,13,s.c);ell(s.x,y,6,6,'#fff');if(s.c=='#ffffff'){ctx.strokeStyle='#8fc3e6';ctx.lineWidth=2;ctx.beginPath();ctx.arc(s.x,y,13,0,7);ctx.stroke()}}}
function weapon(f,s,fx,fy,y,pr){const sp=f.s.spt;
 if(sp=='club'){const a=-2+pr*3.2,L=66,ex=fx+s*Math.cos(a)*L,ey=fy+Math.sin(a)*L,c=f.s.look=='omon'?'#202020':'#8b5a2b';limb(fx,fy,ex,ey,9,c);limb(fx+s*Math.cos(a)*(L-24),fy+Math.sin(a)*(L-24),ex,ey,16,f.s.look=='omon'?'#2e2e2e':'#9a6a38')}
 if(sp=='slash'){ctx.save();ctx.scale(s,1);ctx.strokeStyle='rgba(255,255,255,.85)';ctx.lineWidth=7;ctx.beginPath();ctx.arc(10,y-70,62,-1.3,-1.3+2.6*Math.min(1,pr)+.01);ctx.stroke();ctx.restore();limb(fx,fy,fx+s*62,fy-14,5,'#e6eef5');limb(fx+s*2,fy+7,fx+s*2,fy-9,5,'#c9a227')}
 if(sp=='bolt'){const r=7+pr*14;ctx.globalAlpha=.85;ell(fx+s*10,fy,r,r,f.s.boltc||'#ffd23f');ctx.globalAlpha=1;ell(fx+s*10,fy,r*.45,r*.45,'#fff')}}
function selStart(){run=false;selMode=true;resize();G=H-195;selF=HERO.map((h,i)=>mk(W*(.17+i*.33),1,{...h,hp:h.hp},1));selT=0;last=performance.now();
 menuHTML('','','<div class="col"><button class="shopb" onclick="openShop()">🛒 МАГАЗИН · 🪙 '+coins+'</button><div class="row">'+HERO.map((h,i)=>'<button class="card" onclick="begin('+i+')"><b>'+h.n+'</b><br><small>'+h.spn+'</small><br><span>'+h.d+'</span></button>').join('')+'</div></div>');menu.className='sel';requestAnimationFrame(selLoop)}
function selLoop(tt){if(!selMode)return;const dt=Math.max(0,Math.min(.05,(tt-last)/1000));last=tt;selT+=dt;G=H-195;
 const g=ctx.createLinearGradient(0,0,0,G);g.addColorStop(0,'#16293b');g.addColorStop(1,'#35546d');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
